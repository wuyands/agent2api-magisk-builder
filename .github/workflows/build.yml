name: build

# 可手动触发（指定版本），也可被 daily.yml 复用（`uses: ./.github/workflows/build.yml`）。
#
# 一次构建做的事，顺序有硬约束：
#   ① 拉两个仓库的源码 → ② 打补丁 → ③ **构建前端** → ④ 编译两个 Rust 二进制
# ③ 必须在 ④ 之前，因为 `include_str!` 把 ui/islands/ui.js 编进了网关二进制
# （见 server/src/server/api/plugin_theme.rs）。顺序反了会打出一个「界面还是旧版」
# 的包，而且构建不会报错 —— 这种错误只能靠人肉发现，所以这里用注释钉死。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "网关版本（形如 v3.4.2 或 v3.5.0-beta.7；留空读 upstream.json）"
        required: false
        type: string
      plugin_version:
        description: "插件版本（形如 3.4.2 或 3.5.0-beta.3；留空读 upstream.json）"
        required: false
        type: string
      channel:
        description: "上游通道：stable 只看正式版；beta 连预发布一起看"
        required: false
        default: stable
        type: choice
        options: [stable, beta]
      patch:
        description: "打裁剪补丁（关掉则按上游原样编，用于试跑新版）"
        required: false
        default: true
        type: boolean
      release:
        description: "构建成功后发布 Release"
        required: false
        default: true
        type: boolean

  workflow_call:
    inputs:
      version:
        required: false
        type: string
      plugin_version:
        required: false
        type: string
      channel:
        required: false
        default: stable
        type: string
      patch:
        required: false
        default: true
        type: boolean
      release:
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  # 打补丁与不打补丁的产物**不能共用**一个并发组：两者版本号可能相同，
  # 但二进制、前端、自检结论完全不同，撞在一起会互相覆盖 artifact 与 Release。
  group: build-${{ inputs.version || 'auto' }}-${{ inputs.patch == false && 'raw' || 'patched' }}
  cancel-in-progress: false

env:
  NDK_VERSION: r27d
  ANDROID_API: "26"
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
      plugin_version: ${{ steps.ver.outputs.plugin_version }}
      channel: ${{ steps.ver.outputs.channel }}
      patched: ${{ steps.ver.outputs.patched }}
      zip: ${{ steps.pack.outputs.zip }}

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 解析要构建的版本
        id: ver
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_PLUGIN: ${{ inputs.plugin_version }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_PATCH: ${{ inputs.patch }}
        run: |
          set -euo pipefail
          V="$IN_VERSION"
          P="$IN_PLUGIN"
          C="${IN_CHANNEL:-stable}"
          # inputs.patch 传下来是字符串（workflow_call 里空串也要当成「打补丁」，
          # 不能因为空串就误判成 false）
          case "$IN_PATCH" in
            false|False|0) PATCHED=false ;;
            *) PATCHED=true ;;
          esac
          if [ -z "$V" ] || [ -z "$P" ]; then
            OUT="$(python3 scripts/upstream.py --channel "$C")"
            echo "$OUT"
            [ -z "$V" ] && V="$(printf '%s\n' "$OUT" | sed -n 's/^gateway=//p')"
            [ -z "$P" ] && P="$(printf '%s\n' "$OUT" | sed -n 's/^plugin=//p')"
          fi
          case "$V" in v*) ;; *) V="v$V" ;; esac
          # 插件的 tag 不带 v（网关才是 v3.5.0-beta.7 那种叫法）
          case "$P" in v*) P="${P#v}" ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "plugin_version=$P" >> "$GITHUB_OUTPUT"
          echo "channel=$C" >> "$GITHUB_OUTPUT"
          echo "patched=$PATCHED" >> "$GITHUB_OUTPUT"
          echo "构建目标：网关 $V ＋ 插件 $P（通道 $C，裁剪补丁 $PATCHED）"

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 装 Rust（含 aarch64-linux-android target）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ndk
          key: ndk-${{ env.NDK_VERSION }}-linux

      - name: 下载 NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ndk"
          url="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          echo "下载 $url"
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/ndk.zip" "$url"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP/ndk"
          rm -f "$RUNNER_TEMP/ndk.zip"
          ls "$RUNNER_TEMP/ndk"

      - name: 导出 NDK 路径
        run: |
          set -euo pipefail
          root="$(find "$RUNNER_TEMP/ndk" -maxdepth 1 -type d -name 'android-ndk-*' | head -n 1)"
          test -n "$root" || { echo "找不到解压后的 NDK"; exit 1; }
          echo "ANDROID_NDK_HOME=$root" >> "$GITHUB_ENV"
          echo "NDK: $root"

      # ── 拉两个上游 ────────────────────────────────────────────
      - name: 跑单元测试（补丁引擎 / 版本映射）
        run: |
          set -euo pipefail
          python3 tests/test_patches.py

      - name: 拉上游网关
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.ver.outputs.version }}" \
            https://github.com/aimod-cc/Agent2API build/up

      - name: 拉上游插件
        run: |
          set -euo pipefail
          # 插件的 tag 不带 v；先试不带 v，再试带 v（上游这一处历史上两种都出现过）
          if git clone --depth 1 --branch "${{ steps.ver.outputs.plugin_version }}" \
               https://github.com/ProvidersPlugin/Agent2Providers build/px 2>/dev/null; then
            echo "插件源码：tag ${{ steps.ver.outputs.plugin_version }}"
          else
            git clone --depth 1 --branch "v${{ steps.ver.outputs.plugin_version }}" \
              https://github.com/ProvidersPlugin/Agent2Providers build/px
            echo "插件源码：tag v${{ steps.ver.outputs.plugin_version }}"
          fi

      # ── ② 打补丁（可用 inputs.patch=false 整体跳过）────────────────
      #
      # 跳过时走的是「上游原样」：不打 11 个 Rust 补丁、不打 5 个前端补丁，
      # 于是 Agent 配置页 / 工具本机接入 / 软件自更新 / Clash Verge 读取 /
      # cc-switch 导入**全都还在**。这是给「上游发了新版，先看看它能不能
      # 编过、跑不跑得起来」用的，不是给日常出包用的。
      # 与之配套的两处联动：
      #   · 构建后跑 `scripts/build-android-fixes.py` 补上游没覆盖的 Android 目标
      #     （beta 里有 cfg 分支全落空的代码，桌面 CI 撞不出来）；
      #   · 自检要加 `--no-patch`，否则「被裁功能必须缺席」那两组会把原样包判死。
      - name: 应用补丁（Rust）
        if: ${{ steps.ver.outputs.patched == 'true' }}
        run: python3 patches/apply.py build/up --only rust

      - name: 应用补丁（前端）
        if: ${{ steps.ver.outputs.patched == 'true' }}
        run: python3 patches/apply.py build/up --only frontend

      - name: 说明当前是否打了裁剪补丁
        run: |
          if [ "${{ steps.ver.outputs.patched }}" = "true" ]; then
            echo "已打裁剪补丁：产物将去掉桌面端专属功能"
          else
            echo "！未打裁剪补丁：产物包含上游全部功能（含桌面端专属部分）"
          fi

      # 上游没为 Android 目标做验证，个别代码在 arm64-linux-android 下会
      # 推断不出类型（典型：三条 cfg 分支在不同平台上各 push 一种元素，
      # Android 上一条都不成立）。这一步只做最小必要修补，不改行为。
      - name: 补 Android 目标的编译修补
        run: python3 -u scripts/android-target-fixes.py build/up

      # ── ③ 构建前端（必须早于 ④）────────────────────────────────
      - name: 装前端依赖（ui-islands）
        working-directory: build/up/desktop-tauri/ui-islands
        run: npm ci --no-audit --no-fund

      - name: 装前端依赖（ui-kit）
        working-directory: build/up/desktop-tauri/ui-kit
        run: |
          # ui-islands 的 tsconfig 把 @ui 指到 ../ui-kit/src，typecheck 会去解析
          # 那边的 react / @base-ui/react；这两个 node_modules 都不随仓库来，
          # 单独装 ui-islands 会喷一屏 TS2307。两个都得装。
          npm ci --no-audit --no-fund

      - name: 查类型
        working-directory: build/up/desktop-tauri/ui-islands
        run: npm run typecheck

      - name: 构建前端产物
        working-directory: build/up/desktop-tauri/ui-islands
        run: npm run build

      # ── ④ 编译两个二进制 ──────────────────────────────────────
      - name: 缓存 Rust 产物
        uses: Swatinem/rust-cache@v2
        with:
          # 两套 workspace 各自缓存；key 带上游版本，换版本时不复用旧产物
          workspaces: |
            build/up/desktop-tauri/src-tauri -> /tmp/target-gw
            build/px -> /tmp/target-px
          key: ${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.plugin_version }}

      - name: 编译网关
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-gw
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh server build/up/desktop-tauri/src-tauri "$RUNNER_TEMP/out/agent2api-server"

      - name: 编译插件
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-px
        run: |
          scripts/build.sh providers build/px "$RUNNER_TEMP/out/agent2api-providers"

      # ── 组装模块 ──────────────────────────────────────────────
      - name: 生成模块清单
        run: |
          python3 scripts/prepare.py \
            --version "${{ steps.ver.outputs.version }}" \
            --plugin-version "${{ steps.ver.outputs.plugin_version }}" \
            --server-bin "$RUNNER_TEMP/out/agent2api-server" \
            --providers-bin "$RUNNER_TEMP/out/agent2api-providers" \
            --ui-ui build/up/desktop-tauri/ui \
            --plugin-src build/px

      - name: 跑单元测试（注册表铺设）
        run: |
          set -euo pipefail
          # 这组要读 module/plugin-registry/ 里的模板，所以必须排在生成清单之后
          python3 tests/test_plugin_setup.py

      - name: 打包
        id: pack
        run: |
          set -euo pipefail
          name="agent2api-magisk-${{ steps.ver.outputs.version }}.zip"
          python3 scripts/pack.py --out "out/$name"
          echo "zip=$name" >> "$GITHUB_OUTPUT"

      - name: 自检
        run: |
          # 未打裁剪补丁时，产物里本来就该有 Agent 配置页等入口，
          # 那两组「被裁功能必须缺席 / 路由无残留」的检查会让它永远红。
          flag=""
          if [ "${{ steps.ver.outputs.patched }}" != "true" ]; then flag="--no-patch"; fi
          python3 scripts/verify.py \
            --zip "out/agent2api-magisk-${{ steps.ver.outputs.version }}.zip" \
            --version "${{ steps.ver.outputs.version }}" \
            --plugin-version "${{ steps.ver.outputs.plugin_version }}" \
            --source build/up/desktop-tauri/src-tauri/server/src \
            $flag

      - name: 留档（构建日志之外的可下载产物）
        uses: actions/upload-artifact@v4
        with:
          name: agent2api-magisk-${{ steps.ver.outputs.version }}
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30

      # ── 发布 ─────────────────────────────────────────────────
      #
      # 记录上游版本**只在打过补丁的构建里做**：upstream.json 是「日常出包跟到哪」的
      # 水位线，一次原样试跑不该把它推上去 —— 否则 daily-sync 会以为这个版本已经
      # 出过正式包，再也不补了。
      - name: 记录上游版本
        if: ${{ steps.ver.outputs.patched == 'true' }}
        run: |
          python3 scripts/upstream.py --write \
            --channel "${{ steps.ver.outputs.channel }}" \
            --gateway "${{ steps.ver.outputs.version }}" \
            --plugin "${{ steps.ver.outputs.plugin_version }}"

      - name: 发布 Release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          PLUGIN: ${{ steps.ver.outputs.plugin_version }}
          CHANNEL: ${{ steps.ver.outputs.channel }}
          PATCHED: ${{ steps.ver.outputs.patched }}
        run: |
          set -euo pipefail
          zip="out/agent2api-magisk-$VERSION.zip"

          # 原样包与裁剪包**必须是两个 tag**：同一个上游版本可以既有一个「正式
          # 模块」又有一个「试跑原样模块」，两者二进制与界面都不一样，共用一个
          # tag 会互相覆盖资产，事后分不清哪个是能日常用的。
          if [ "$PATCHED" = "true" ]; then
            tag="$VERSION"
            title="Agent2API Magisk 模块 $VERSION"
          else
            tag="$VERSION-raw"
            title="Agent2API Magisk 模块 $VERSION（上游原样，未裁剪）"
          fi

          sum="$(sha256sum "$zip" | cut -d' ' -f1)"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "同步上游 \`aimod-cc/Agent2API\` **$VERSION**"
            echo ""
            echo "- 提供商插件 \`ProvidersPlugin/Agent2Providers\` **$PLUGIN**"
            echo "- 目标：Android arm64（API 26+），Magisk 20.4+"
            if [ "$CHANNEL" = "beta" ]; then
              echo "- 上游通道：**beta**（预发布，可能随时换掉；日常使用建议留在正式通道）"
            fi
            if [ "$PATCHED" = "true" ]; then
              echo "- 已裁掉桌面端专属功能（Agent 配置 / 工具本机接入 / 软件自更新 / Clash Verge / cc-switch 导入）"
            else
              echo "- **未裁剪**：含上游全部功能，包括在手机上用不了的桌面端专属部分"
              echo "  （Agent 配置页读不到也写不进客户端配置、本机接入装不了桌面客户端、"
              echo "  软件自更新没有可替换的安装包、Clash Verge 配置不存在、cc-switch 导入无源）"
              echo "- 只用于「上游新版能不能编过、跑不跑得起来」的验证，不要当日常包用"
            fi
            echo ""
            echo '```'
            echo "sha256  $sum"
            echo '```'
            echo ""
            echo "刷入：\`adb push agent2api-magisk-$VERSION.zip /data/local/tmp/\` 后"
            echo "\`su -c magisk --install-module /data/local/tmp/agent2api-magisk-$VERSION.zip\`，重启生效。"
          } > "$notes"

          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag 已存在，只补资产"
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" \
              --title "$title" \
              --notes-file "$notes" \
              $prerelease
          fi

      - name: 提交 upstream.json
        if: ${{ steps.ver.outputs.patched == 'true' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- upstream.json; then
            echo "upstream.json 没变，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream.json
          git commit -m "chore: 记录上游版本 ${{ steps.ver.outputs.version }} / ${{ steps.ver.outputs.plugin_version }}（${{ steps.ver.outputs.channel }}）"
          git push
