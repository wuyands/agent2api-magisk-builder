<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent2API 网关</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #fff; --text: #17181c; --muted: #6b7280;
    --line: #e5e7eb; --accent: #3b6ef6; --ok: #16a34a; --bad: #dc2626; --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#171a21; --text:#e6e8ee; --muted:#9aa3b2; --line:#242936; --accent:#6f95ff; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  h1 { font-size:18px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:7px 0; }
  .row + .row { border-top:1px solid var(--line); }
  .k { color:var(--muted); font-size:13px; flex:0 0 auto; }
  .v { font-variant-numeric:tabular-nums; text-align:right; word-break:break-all; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .btns { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  button { font:inherit; padding:11px 8px; border-radius:11px; cursor:pointer;
           border:1px solid var(--line); background:var(--card); color:var(--text); }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.5; }
  a.open { display:block; text-align:center; text-decoration:none; padding:12px;
           border-radius:12px; font-weight:600; background:var(--accent); color:#fff; margin-top:10px; }
  .switch-row { display:flex; justify-content:space-between; align-items:center;
                padding:10px 0; border-top:1px solid var(--line); margin-top:4px; }
  .switch { position:relative; width:46px; height:26px; border-radius:13px;
            background:var(--line); transition:background .18s; flex:0 0 auto; cursor:pointer; }
  .switch.on { background:var(--accent); }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px;
                   border-radius:50%; background:#fff; transition:transform .18s; }
  .switch.on::after { transform:translateX(20px); }
  pre { margin:8px 0 0; padding:10px; border-radius:10px; background:rgba(127,127,127,.10);
        font-size:12px; line-height:1.45; max-height:220px; overflow:auto;
        white-space:pre-wrap; word-break:break-all; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  .warn { color:var(--warn); }
</style>
</head>
<body>

<h1>Agent2API 网关</h1>
<div class="sub">OpenAI 兼容 · 本机 3065 端口</div>

<div class="card">
  <div class="row"><span class="k">运行状态</span><span class="v" id="state">检测中…</span></div>
  <div class="row"><span class="k">健康检查</span><span class="v" id="health">—</span></div>
  <div class="row"><span class="k">面板地址</span><span class="v" id="panel">—</span></div>
  <div class="row"><span class="k">接口地址</span><span class="v" id="api">—</span></div>
</div>

<div class="card">
  <div class="btns">
    <button id="btn-start">启动</button>
    <button id="btn-restart">重启</button>
    <button id="btn-stop">停止</button>
  </div>
  <div class="switch-row">
    <div>
      <div>局域网访问</div>
      <div class="hint" id="lan-hint">关闭时只有手机本机能访问</div>
    </div>
    <div class="switch" id="lan-sw"></div>
  </div>
  <a class="open" id="btn-open" href="#" target="_blank" rel="noopener">打开管理面板 ↗</a>
  <div class="hint">面板里的「账号」页添加各平台账号；「网关 Key」页创建 API Key。</div>
</div>

<div class="card">
  <div class="row" style="border:none;padding-bottom:0">
    <span class="k">最近日志</span>
    <button id="btn-log" style="padding:6px 12px;font-size:13px">刷新</button>
  </div>
  <pre id="log">点「刷新」读取</pre>
</div>

<script>
// KernelSU / APatch 的 WebView 桥；Magisk 官方管理器没有这个对象。
// 没有桥时降级为只读：显示地址、无法启停。
const hasShell = typeof ksu !== 'undefined' && typeof ksu.exec === 'function';
const $ = (id) => document.getElementById(id);

function sh(cmd) {
  return new Promise((resolve) => {
    if (!hasShell) return resolve({ code: -1, out: '当前环境不支持执行命令（请用 KSU/APatch 的 WebUI）' });
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    window[cb] = (errno, stdout, stderr) => {
      delete window[cb];
      resolve({ code: errno, out: (stdout || '') + (stderr || '') });
    };
    try { ksu.exec(cmd, '{}', cb); }
    catch (e) { delete window[cb]; resolve({ code: -1, out: String(e) }); }
  });
}

const CTL = 'sh /data/adb/modules/agent2api/ctl.sh';
let lanOn = false;

async function refresh() {
  const r = await sh(`${CTL} status`);
  const text = (r.out || '').trim();

  const running = /状态:\s*运行中/.test(text);
  $('state').innerHTML = running
    ? '<span class="dot ok"></span>运行中'
    : '<span class="dot bad"></span>未运行';

  const health = (text.match(/健康检查:\s*(.*)/) || [])[1] || '—';
  $('health').textContent = health;

  const port = (text.match(/监听:\s*([^\s:]+):(\d+)/) || []);
  const host = port[1] || '127.0.0.1';
  const p = port[2] || '3065';
  const panel = `http://127.0.0.1:${p}/`;
  $('panel').textContent = panel;
  $('api').textContent = `http://127.0.0.1:${p}/v1`;
  $('btn-open').href = panel;

  // 局域网开关状态
  lanOn = (host === '0.0.0.0');
  $('lan-sw').className = 'switch' + (lanOn ? ' on' : '');
  const lanIp = (text.match(/局域网:\s*http:\/\/([0-9.]+):(\d+)\//) || []);
  $('lan-hint').innerHTML = lanOn
    ? (lanIp[1] ? `局域网地址 <b>http://${lanIp[1]}:${lanIp[2]}/</b>` : '已开放，但没取到局域网 IP')
    : '关闭时只有手机本机能访问';

  if (!hasShell) {
    ['btn-start', 'btn-stop', 'btn-restart', 'btn-log'].forEach(id => $(id).disabled = true);
  }
}

async function act(kind) {
  const btn = $('btn-' + kind);
  const old = btn.textContent;
  btn.textContent = '…';
  btn.disabled = true;
  await sh(`${CTL} ${kind}`);
  await new Promise(r => setTimeout(r, kind === 'stop' ? 800 : 2200));
  await refresh();
  btn.textContent = old;
  btn.disabled = false;
}

async function toggleLan() {
  const target = lanOn ? 'off' : 'on';
  if (target === 'on') {
    if (!confirm('开放后同一局域网内的任何设备都能打开面板。\n请确认已注册管理员并创建 API Key，否则 /v1 接口无鉴权。\n\n继续？')) return;
  }
  const sw = $('lan-sw');
  sw.style.opacity = '.5';
  await sh(`${CTL} lan ${target}`);
  await new Promise(r => setTimeout(r, 2500));
  sw.style.opacity = '';
  await refresh();
}

async function showLog() {
  const r = await sh(`${CTL} log 80`);
  $('log').textContent = (r.out || '').trim() || '(空)';
}

$('btn-start').onclick = () => act('start');
$('btn-stop').onclick = () => act('stop');
$('btn-restart').onclick = () => act('restart');
$('btn-log').onclick = showLog;
$('lan-sw').onclick = toggleLan;

refresh();
</script>
</body>
</html>
